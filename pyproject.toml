[project]
name = "fundamentos-python-estudiantes"
version = "0.3.0"
description = "Notebooks estudiantiles de Fundamentos de Python para Análisis de Datos"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anywidget==0.9.21",
    "marimo[recommended]>=0.24.0",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "traitlets>=5.14",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["course_widgets"]

[tool.setuptools.package-data]
course_widgets = [
    "assets/*.js",
    "assets/*.css",
]

[tool.marimo.runtime]
auto_instantiate = false
